<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Art Director — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #0a0805;
  --bg-card: #120f0a;
  --bg-input: #1a160f;
  --gold: #c8860a;
  --gold-glow: rgba(200,134,10,0.15);
  --text-main: #f5f0e8;
  --text-muted: #8c8273;
  --border: #262015;
  --danger: #cf4343;
  --danger-glow: rgba(207,67,67,0.15);
  --success: #3db87e;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg-main);color:var(--text-main);font-family:'DM Mono',monospace;font-size:13px;letter-spacing:-0.02em;line-height:1.5;min-height:100vh;}

/* ── LOGIN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-box{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:40px 32px;width:100%;max-width:360px;text-align:center;}
.login-logo{font-size:22px;color:var(--gold);margin-bottom:6px;letter-spacing:.1em;}
.login-title{font-size:15px;font-weight:500;color:var(--text-main);margin-bottom:4px;}
.login-sub{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:28px;}
.login-input{width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text-main);padding:12px 16px;font-family:inherit;font-size:13px;border-radius:4px;outline:none;margin-bottom:12px;transition:border-color .2s;}
.login-input:focus{border-color:var(--gold);}
.login-btn{width:100%;padding:12px;background:var(--gold-glow);border:1px solid var(--gold);color:var(--gold);font-family:inherit;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;border-radius:4px;cursor:pointer;transition:all .2s;}
.login-btn:hover{background:var(--gold);color:var(--bg-main);}
.login-error{font-size:11px;color:var(--danger);margin-top:8px;min-height:16px;}

/* ── ADMIN ── */
#admin-screen{display:none;padding:24px;}

/* HEADER */
header{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--border);margin-bottom:32px;}
.logo-area{display:flex;align-items:center;gap:12px;}
.logo-title{font-size:16px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;}
.logo-title span{color:var(--gold);}
.badge-admin{background:var(--gold-glow);border:1px solid var(--gold);color:var(--gold);padding:2px 8px;font-size:10px;text-transform:uppercase;border-radius:3px;}
.header-actions{display:flex;align-items:center;gap:12px;}
.last-update{font-size:11px;color:var(--text-muted);}

/* BUTTONS */
.btn{background:transparent;border:1px solid var(--border);color:var(--text-main);padding:8px 16px;font-family:inherit;font-size:12px;cursor:pointer;transition:all .2s;border-radius:4px;display:inline-flex;align-items:center;gap:8px;}
.btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-glow);}
.btn-secondary{color:var(--text-muted);}
.btn-secondary:hover{border-color:var(--text-muted);color:var(--text-main);background:rgba(255,255,255,0.05);}
.btn-action-activate{border-color:var(--gold);color:var(--gold);background:var(--gold-glow);padding:6px 12px;font-size:11px;text-transform:uppercase;width:100%;justify-content:center;white-space:nowrap;}
.btn-action-activate:hover{background:var(--gold);color:var(--bg-main);}
.btn-action-deactivate{border-color:var(--danger);color:var(--danger);background:var(--danger-glow);padding:6px 12px;font-size:11px;text-transform:uppercase;width:100%;justify-content:center;white-space:nowrap;}
.btn-action-deactivate:hover{background:var(--danger);color:var(--text-main);}
.btn-loading{opacity:.5;cursor:not-allowed;pointer-events:none;}

/* METRICS */
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px;}
.metric-card{background:var(--bg-card);border:1px solid var(--border);padding:20px;border-radius:6px;position:relative;overflow:hidden;transition:border-color .2s;}
.metric-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--border),transparent);transition:background .2s;}
.metric-card:hover{border-color:rgba(200,134,10,0.3);}
.metric-card:hover::before{background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.metric-label{color:var(--text-muted);font-size:11px;text-transform:uppercase;margin-bottom:8px;display:block;}
.metric-value{font-size:28px;font-weight:500;color:var(--text-main);}
.metric-value.highlight{color:var(--gold);text-shadow:0 0 10px var(--gold-glow);}
.metric-value.green{color:var(--success);}
.metric-value.blue{color:#5dade2;}

/* CONTROLS */
.controls-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;background:var(--bg-card);border:1px solid var(--border);padding:16px;border-radius:6px 6px 0 0;border-bottom:none;}
.search-wrapper{position:relative;flex:1;min-width:280px;}
.search-input{width:100%;background:var(--bg-input);border:1px solid var(--border);color:var(--text-main);padding:10px 16px;font-family:inherit;border-radius:4px;font-size:13px;transition:all .2s;outline:none;}
.search-input:focus{border-color:var(--gold);box-shadow:0 0 8px var(--gold-glow);}
.filters-group{display:flex;gap:8px;flex-wrap:wrap;}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);padding:8px 14px;font-family:inherit;font-size:12px;cursor:pointer;border-radius:4px;transition:all .2s;}
.filter-btn:hover{border-color:var(--text-main);color:var(--text-main);}
.filter-btn.active{background:var(--gold-glow);border-color:var(--gold);color:var(--gold);}

/* TABLE */
.table-container{background:var(--bg-card);border:1px solid var(--border);border-radius:0 0 6px 6px;overflow-x:auto;}
.table-header-info{display:flex;justify-content:space-between;padding:12px 24px;background:rgba(0,0,0,0.2);border-bottom:1px solid var(--border);color:var(--text-muted);font-size:11px;text-transform:uppercase;}
table{width:100%;border-collapse:collapse;text-align:left;}
th{color:var(--text-muted);font-weight:400;text-transform:uppercase;font-size:11px;padding:16px 24px;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.1);white-space:nowrap;}
td{padding:14px 24px;border-bottom:1px solid var(--border);vertical-align:middle;word-break:break-word;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(200,134,10,0.02);}
.col-name{min-width:160px;width:20%;}
.col-email{min-width:200px;width:24%;color:var(--text-muted);}
.col-whatsapp{min-width:140px;width:14%;}
.col-plan{min-width:80px;width:9%;}
.col-date{min-width:130px;width:12%;color:var(--text-muted);font-size:12px;}
.col-action{min-width:140px;width:13%;white-space:nowrap;}

/* BADGES */
.badge-plan{display:inline-block;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:500;text-transform:uppercase;}
.badge-plan.free{background:rgba(140,130,115,0.1);border:1px solid rgba(140,130,115,0.3);color:var(--text-muted);}
.badge-plan.pro{background:var(--gold-glow);border:1px solid var(--gold);color:var(--gold);box-shadow:0 0 8px rgba(200,134,10,0.1);}
.badge-new{display:inline-block;background:rgba(52,152,219,.12);border:1px solid rgba(52,152,219,.25);color:#5dade2;border-radius:3px;font-size:9px;padding:1px 5px;margin-left:5px;text-transform:uppercase;vertical-align:middle;}

.whatsapp-link{color:var(--success);text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.whatsapp-link:hover{text-decoration:underline;}
.anonymous-user{font-style:italic;color:var(--text-muted);}
.empty-dash{color:rgba(255,255,255,0.15);}

/* EMPTY / LOADING */
.empty-state{padding:48px;text-align:center;color:var(--text-muted);}
.loading-state{padding:48px;text-align:center;color:var(--text-muted);}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(200,134,10,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;padding:12px 18px;font-size:12px;color:var(--text-main);opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{border-color:rgba(61,184,126,.4);color:var(--success);}
.toast.error{border-color:rgba(207,67,67,.4);color:var(--danger);}

@media(max-width:768px){
  #admin-screen{padding:16px;}
  .metrics-grid{grid-template-columns:repeat(2,1fr);}
  .controls-bar{flex-direction:column;align-items:stretch;}
  th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){display:none;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">✦</div>
    <div class="login-title">Food Art Director</div>
    <div class="login-sub">Painel Administrativo</div>
    <input class="login-input" type="password" id="admin-pass" placeholder="Senha de acesso" autocomplete="off">
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-err"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <header>
    <div class="logo-area">
      <div class="logo-title">✦ Food Art <span>Director</span></div>
      <span class="badge-admin">Admin</span>
    </div>
    <div class="header-actions">
      <span class="last-update" id="last-update"></span>
      <button class="btn" onclick="loadData()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38"/></svg>
        Atualizar
      </button>
      <button class="btn btn-secondary" onclick="doLogout()">Sair</button>
    </div>
  </header>

  <!-- METRICS -->
  <section class="metrics-grid">
    <div class="metric-card"><span class="metric-label">Total Cadastros</span><div class="metric-value" id="m-total">—</div></div>
    <div class="metric-card"><span class="metric-label">Assinantes PRO</span><div class="metric-value highlight" id="m-pro">—</div></div>
    <div class="metric-card"><span class="metric-label">Plano Free</span><div class="metric-value" id="m-free">—</div></div>
    <div class="metric-card"><span class="metric-label">Taxa Conversão</span><div class="metric-value green" id="m-conv">—</div></div>
    <div class="metric-card"><span class="metric-label">Cadastros Hoje</span><div class="metric-value blue" id="m-hoje">—</div></div>
    <div class="metric-card"><span class="metric-label">Com WhatsApp</span><div class="metric-value" id="m-whats">—</div></div>
  </section>

  <!-- CONTROLS -->
  <section class="controls-bar">
    <div class="search-wrapper">
      <input type="text" class="search-input" id="search-input" placeholder="Buscar por nome, email ou WhatsApp..." oninput="filterTable()">
    </div>
    <div class="filters-group">
      <button class="filter-btn active" onclick="setFilter('todos',this)">Todos</button>
      <button class="filter-btn" onclick="setFilter('pro',this)">✦ PRO</button>
      <button class="filter-btn" onclick="setFilter('free',this)">Free</button>
      <button class="filter-btn" onclick="setFilter('sem-whats',this)">Sem WhatsApp</button>
      <button class="filter-btn" onclick="setFilter('hoje',this)">Hoje</button>
    </div>
    <button class="btn" onclick="exportCSV()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      Exportar CSV
    </button>
  </section>

  <!-- TABLE -->
  <main class="table-container">
    <div class="table-header-info">
      <div>Listagem de Usuários</div>
      <div id="table-count">—</div>
    </div>
    <div id="table-body">
      <div class="loading-state"><span class="spinner"></span> Carregando...</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────
var ADMIN_PASSWORD = '15091989';
var SUPABASE_URL   = 'https://yclvvfapkdwltayuiivy.supabase.co';
var SUPABASE_KEY   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljbHZ2ZmFwa2R3bHRheXVpaXZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NzExMDMsImV4cCI6MjA5NDU0NzEwM30.O4fuDlL_KGPPO9WHaazrOtbkfO5KVpbVwpND5sVH0IA';

// ── STATE ─────────────────────────────────────────────────
var sb;
var allUsers = [];
var currentFilter = 'todos';

function initSb() {
  if (!sb && typeof supabase !== 'undefined')
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  return !!sb;
}

// ── LOGIN ─────────────────────────────────────────────────
document.getElementById('admin-pass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

function doLogin() {
  initSb();
  var pass = document.getElementById('admin-pass').value;
  if (pass === ADMIN_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    sessionStorage.setItem('fa_admin','1');
    loadData();
  } else {
    document.getElementById('login-err').textContent = 'Senha incorreta.';
    document.getElementById('admin-pass').value = '';
  }
}

function doLogout() {
  sessionStorage.removeItem('fa_admin');
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-pass').value = '';
}

window.addEventListener('load', function() {
  initSb();
  if (sessionStorage.getItem('fa_admin') === '1') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    loadData();
  }
});

// ── LOAD DATA ─────────────────────────────────────────────
async function loadData() {
  if (!initSb()) {
    document.getElementById('table-body').innerHTML = '<div class="empty-state">Erro de conexao. Recarregue a pagina.</div>';
    return;
  }
  document.getElementById('table-body').innerHTML = '<div class="loading-state"><span class="spinner"></span> Carregando...</div>';

  try {
    var r1 = await sb.from('profiles').select('*').order('created_at', {ascending:false});
    var r2 = await sb.from('assinaturas').select('email,ativo,plano,data_compra,updated_at');

    if (r1.error) throw r1.error;
    if (r2.error) throw r2.error;

    var profiles   = r1.data || [];
    var assinaturas = r2.data || [];

    var assMap = {};
    assinaturas.forEach(function(a){ assMap[a.email] = a; });

    allUsers = profiles.map(function(p){
      return Object.assign({}, p, {
        assinatura: assMap[p.email] || null,
        isPro: !!(assMap[p.email] && assMap[p.email].ativo)
      });
    });

    // Inclui assinantes sem cadastro
    assinaturas.forEach(function(a){
      if (!profiles.find(function(p){ return p.email === a.email; })) {
        allUsers.push({ id:null, name:null, email:a.email, whatsapp:null,
          created_at: a.data_compra, assinatura:a, isPro:a.ativo });
      }
    });

    updateMetrics();
    filterTable();

    var now = new Date();
    document.getElementById('last-update').textContent =
      'Atualizado às ' + now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

  } catch(err) {
    document.getElementById('table-body').innerHTML =
      '<div class="empty-state">Erro ao carregar: ' + err.message + '</div>';
    showToast('Erro ao carregar dados','error');
  }
}

// ── METRICS ───────────────────────────────────────────────
function updateMetrics() {
  var total = allUsers.length;
  var pro   = allUsers.filter(function(u){ return u.isPro; }).length;
  var free  = total - pro;
  var conv  = total > 0 ? Math.round(pro/total*100) : 0;
  var hoje  = new Date().toISOString().split('T')[0];
  var novos = allUsers.filter(function(u){ return u.created_at && u.created_at.startsWith(hoje); }).length;
  var comW  = allUsers.filter(function(u){ return u.whatsapp; }).length;

  document.getElementById('m-total').textContent = total;
  document.getElementById('m-pro').textContent   = pro;
  document.getElementById('m-free').textContent  = free;
  document.getElementById('m-conv').textContent  = conv + '%';
  document.getElementById('m-hoje').textContent  = novos;
  document.getElementById('m-whats').textContent = comW;
}

// ── FILTER ────────────────────────────────────────────────
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  filterTable();
}

function filterTable() {
  var q    = (document.getElementById('search-input').value || '').toLowerCase().trim();
  var hoje = new Date().toISOString().split('T')[0];

  var filtered = allUsers.filter(function(u) {
    if (currentFilter === 'pro')       return u.isPro;
    if (currentFilter === 'free')      return !u.isPro;
    if (currentFilter === 'sem-whats') return !u.whatsapp;
    if (currentFilter === 'hoje')      return u.created_at && u.created_at.startsWith(hoje);
    return true;
  });

  if (q) {
    filtered = filtered.filter(function(u) {
      return (u.name  || '').toLowerCase().includes(q) ||
             (u.email || '').toLowerCase().includes(q) ||
             (u.whatsapp || '').includes(q);
    });
  }

  renderTable(filtered);
}

// ── RENDER TABLE ──────────────────────────────────────────
function renderTable(data) {
  document.getElementById('table-count').textContent = (data.length) + ' usuário(s) encontrado(s)';

  if (!data || !data.length) {
    document.getElementById('table-body').innerHTML = '<div class="empty-state">Nenhum usuário encontrado.</div>';
    return;
  }

  var hoje = new Date().toISOString().split('T')[0];

  var rows = data.map(function(u) {
    var isNovo   = u.created_at && u.created_at.startsWith(hoje);
    var novoBadge = isNovo ? '<span class="badge-new">Novo</span>' : '';

    // Nome: se não tem, extrai prefixo do email
    var nomeDisplay;
    if (u.name) {
      nomeDisplay = escHtml(u.name) + novoBadge;
    } else {
      var prefix = (u.email || '').split('@')[0];
      nomeDisplay = '<span class="anonymous-user">Membro PRO (' + escHtml(prefix) + ')</span>' + novoBadge;
    }

    var emailDisplay = u.email
      ? '<span title="' + escHtml(u.email) + '">' + escHtml(u.email) + '</span>'
      : '<span class="empty-dash">—</span>';

    var whatsDisplay = u.whatsapp
      ? '<a class="whatsapp-link" href="https://wa.me/55' + u.whatsapp + '" target="_blank">' + fmtWhats(u.whatsapp) + '</a>'
      : '<span class="empty-dash">—</span>';

    var planBadge = u.isPro
      ? '<span class="badge-plan pro">PRO</span>'
      : '<span class="badge-plan free">Free</span>';

    var dataCad = u.created_at ? fmtDate(u.created_at) : '<span class="empty-dash">—</span>';
    var dataPag = (u.assinatura && u.assinatura.data_compra) ? fmtDate(u.assinatura.data_compra) : '<span class="empty-dash">—</span>';

    var btnAcao = u.isPro
      ? '<button class="btn btn-action-deactivate" onclick="togglePro(\'' + escHtml(u.email) + '\',false,this)">Desativar</button>'
      : '<button class="btn btn-action-activate"   onclick="togglePro(\'' + escHtml(u.email) + '\',true,this)">Ativar PRO</button>';

    return '<tr>' +
      '<td class="col-name">'   + nomeDisplay  + '</td>' +
      '<td class="col-email">'  + emailDisplay + '</td>' +
      '<td class="col-whatsapp">'+ whatsDisplay + '</td>' +
      '<td class="col-plan">'   + planBadge    + '</td>' +
      '<td class="col-date">'   + dataCad      + '</td>' +
      '<td class="col-date">'   + dataPag      + '</td>' +
      '<td class="col-action">' + btnAcao      + '</td>' +
    '</tr>';
  }).join('');

  document.getElementById('table-body').innerHTML =
    '<table>' +
      '<thead><tr>' +
        '<th class="col-name">Nome</th>' +
        '<th class="col-email">Email</th>' +
        '<th class="col-whatsapp">WhatsApp</th>' +
        '<th class="col-plan">Plano</th>' +
        '<th class="col-date">Cadastro</th>' +
        '<th class="col-date">Pagamento</th>' +
        '<th class="col-action">Ação</th>' +
      '</tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
    '</table>';
}

// ── TOGGLE PRO ────────────────────────────────────────────
async function togglePro(email, ativar, btn) {
  if (!initSb()) { showToast('Erro de conexao','error'); return; }
  btn.classList.add('btn-loading');
  btn.textContent = '...';

  try {
    if (ativar) {
      var res = await sb.from('assinaturas').upsert({
        email: email, ativo: true, plano: 'pro',
        data_compra: new Date().toISOString(),
        updated_at:  new Date().toISOString()
      }, { onConflict: 'email' });
      if (res.error) throw res.error;
      showToast('✦ PRO ativado para ' + email, 'success');
    } else {
      var res2 = await sb.from('assinaturas')
        .update({ ativo: false, updated_at: new Date().toISOString() })
        .eq('email', email);
      if (res2.error) throw res2.error;
      showToast('PRO desativado para ' + email, 'success');
    }

    // Atualiza state local
    var u = allUsers.find(function(x){ return x.email === email; });
    if (u) {
      u.isPro = ativar;
      if (!u.assinatura) u.assinatura = {};
      u.assinatura.ativo = ativar;
      if (ativar) u.assinatura.data_compra = new Date().toISOString();
    }
    updateMetrics();
    filterTable();

  } catch(err) {
    showToast('Erro: ' + err.message, 'error');
    btn.classList.remove('btn-loading');
    btn.textContent = ativar ? 'Ativar PRO' : 'Desativar';
  }
}

// ── EXPORT CSV ────────────────────────────────────────────
function exportCSV() {
  var headers = ['Nome','Email','WhatsApp','Plano','Data Cadastro','Data Pagamento'];
  var rows = allUsers.map(function(u){
    return [
      u.name || '',
      u.email || '',
      u.whatsapp ? fmtWhats(u.whatsapp) : '',
      u.isPro ? 'PRO' : 'Free',
      u.created_at ? fmtDate(u.created_at) : '',
      (u.assinatura && u.assinatura.data_compra) ? fmtDate(u.assinatura.data_compra) : ''
    ];
  });
  var csv = [headers].concat(rows).map(function(r){
    return r.map(function(v){ return '"' + String(v).replace(/"/g,'""') + '"'; }).join(',');
  }).join('\n');
  var blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href     = url;
  a.download = 'foodart-usuarios-' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV exportado!', 'success');
}

// ── HELPERS ───────────────────────────────────────────────
function fmtDate(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function fmtWhats(d) {
  if (!d) return '';
  d = d.replace(/\D/g,'');
  return d.length === 11 ? '(' + d.slice(0,2) + ') ' + d.slice(2,7) + '-' + d.slice(7) : d;
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(window._tt);
  window._tt = setTimeout(function(){ t.classList.remove('show'); }, 3000);
}

// Auto refresh a cada 60s
setInterval(function(){
  if (sessionStorage.getItem('fa_admin') === '1') loadData();
}, 60000);
</script>
