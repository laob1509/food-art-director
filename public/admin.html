<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Art Director — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #0a0805;
    --bg2: #110e08;
    --bg3: #1a1510;
    --border: rgba(200,134,10,0.15);
    --border2: rgba(200,134,10,0.3);
    --amber: #c8860a;
    --amber-l: #f0a020;
    --cream: #f0e8d0;
    --text: #e8dcc8;
    --text2: rgba(232,220,200,0.65);
    --text3: rgba(232,220,200,0.35);
    --green: #2ecc71;
    --red: #e74c3c;
    --blue: #3498db;
    --r: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Mono', 'Courier New', monospace; min-height: 100vh; }

  /* ── LOGIN ── */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .login-box {
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: 16px; padding: 40px 32px; width: 100%; max-width: 360px;
    text-align: center;
  }
  .login-logo { font-size: 28px; margin-bottom: 8px; }
  .login-title { font-size: 18px; font-weight: 700; color: var(--cream); margin-bottom: 4px; font-family: serif; }
  .login-sub { font-size: 11px; color: var(--text3); margin-bottom: 28px; letter-spacing: .05em; text-transform: uppercase; }
  .login-input {
    width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.08); border-radius: 8px;
    color: var(--cream); font-family: inherit; font-size: 14px;
    outline: none; margin-bottom: 12px; transition: border-color .2s;
  }
  .login-input:focus { border-color: var(--amber); }
  .login-btn {
    width: 100%; padding: 13px; background: linear-gradient(135deg, rgba(160,100,8,.9), rgba(100,55,4,.95));
    border: 1px solid var(--border2); border-radius: 8px; color: rgba(240,220,180,.95);
    font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; cursor: pointer; transition: opacity .2s;
  }
  .login-btn:hover { opacity: .85; }
  .login-error { font-size: 11px; color: var(--red); margin-top: 8px; min-height: 16px; }

  /* ── ADMIN ── */
  #admin-screen { display: none; }

  .topbar {
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar-logo { font-size: 14px; color: var(--amber-l); font-weight: 700; letter-spacing: .05em; }
  .topbar-badge {
    background: rgba(200,134,10,.15); border: 1px solid var(--border2);
    border-radius: 4px; padding: 2px 8px; font-size: 10px; color: var(--amber); letter-spacing: .1em;
  }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .btn-refresh {
    background: none; border: 1px solid var(--border2); border-radius: 6px;
    color: var(--text2); padding: 6px 12px; font-family: inherit; font-size: 11px;
    cursor: pointer; transition: all .2s;
  }
  .btn-refresh:hover { border-color: var(--amber); color: var(--amber); }
  .btn-logout { background: none; border: none; color: var(--text3); font-family: inherit; font-size: 11px; cursor: pointer; }
  .btn-logout:hover { color: var(--red); }

  .main { padding: 24px; max-width: 1400px; margin: 0 auto; }

  /* ── METRIC CARDS ── */
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .metric-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--r); padding: 16px 18px;
  }
  .metric-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px; }
  .metric-value { font-size: 28px; font-weight: 700; color: var(--cream); }
  .metric-value.green { color: var(--green); }
  .metric-value.amber { color: var(--amber-l); }
  .metric-value.blue { color: var(--blue); }
  .metric-sub { font-size: 10px; color: var(--text3); margin-top: 4px; }

  /* ── CONTROLS ── */
  .controls {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-input {
    width: 100%; padding: 10px 14px 10px 36px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: inherit; font-size: 12px;
    outline: none; transition: border-color .2s;
  }
  .search-input:focus { border-color: var(--amber); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 13px; }
  .filter-tabs { display: flex; gap: 4px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 4px; }
  .filter-tab {
    padding: 6px 14px; border-radius: 5px; font-family: inherit; font-size: 11px;
    font-weight: 700; letter-spacing: .05em; cursor: pointer; border: none;
    background: none; color: var(--text3); transition: all .2s; white-space: nowrap;
  }
  .filter-tab.active { background: rgba(200,134,10,.15); color: var(--amber-l); }
  .btn-csv {
    padding: 10px 16px; background: var(--bg2); border: 1px solid var(--border2);
    border-radius: 8px; color: var(--text2); font-family: inherit; font-size: 11px;
    font-weight: 700; cursor: pointer; transition: all .2s; white-space: nowrap;
  }
  .btn-csv:hover { border-color: var(--green); color: var(--green); }

  /* ── TABLE ── */
  .table-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
  .table-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .table-title { font-size: 12px; color: var(--text2); letter-spacing: .05em; text-transform: uppercase; }
  .table-count { font-size: 11px; color: var(--text3); }

  table { width: 100%; border-collapse: collapse; }
  th {
    padding: 10px 16px; text-align: left; font-size: 10px; color: var(--text3);
    text-transform: uppercase; letter-spacing: .1em; border-bottom: 1px solid var(--border);
    background: var(--bg3); white-space: nowrap;
  }
  td { padding: 12px 16px; font-size: 12px; border-bottom: 1px solid rgba(200,134,10,0.06); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(200,134,10,0.03); }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase;
  }
  .badge-pro { background: rgba(200,134,10,.15); color: var(--amber-l); border: 1px solid rgba(200,134,10,.3); }
  .badge-free { background: rgba(232,220,200,.06); color: var(--text3); border: 1px solid rgba(232,220,200,.1); }
  .badge-new { background: rgba(52,152,219,.12); color: #5dade2; border: 1px solid rgba(52,152,219,.2); }

  .status-dot {
    width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px;
  }
  .dot-pro { background: var(--amber-l); box-shadow: 0 0 6px rgba(200,134,10,.6); }
  .dot-free { background: var(--text3); }
  .dot-new { background: var(--blue); }

  .action-btn {
    padding: 5px 10px; border-radius: 5px; font-family: inherit; font-size: 10px;
    font-weight: 700; letter-spacing: .05em; cursor: pointer; border: 1px solid;
    transition: all .2s; text-transform: uppercase;
  }
  .btn-ativar { background: rgba(200,134,10,.1); color: var(--amber-l); border-color: rgba(200,134,10,.3); }
  .btn-ativar:hover { background: rgba(200,134,10,.2); }
  .btn-desativar { background: rgba(231,76,60,.08); color: #e74c3c; border-color: rgba(231,76,60,.2); }
  .btn-desativar:hover { background: rgba(231,76,60,.15); }
  .btn-loading { opacity: .5; cursor: not-allowed; }

  .empty-state { padding: 48px; text-align: center; color: var(--text3); font-size: 13px; }

  .whats-link { color: var(--green); text-decoration: none; }
  .whats-link:hover { text-decoration: underline; }

  .td-name { font-weight: 700; color: var(--cream); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .td-email { color: var(--text2); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .td-date { color: var(--text3); white-space: nowrap; }
  .td-whats { white-space: nowrap; }

  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 9999;
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: 8px; padding: 12px 18px; font-size: 12px; color: var(--cream);
    opacity: 0; transform: translateY(10px); transition: all .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { border-color: rgba(46,204,113,.4); color: var(--green); }
  .toast.error { border-color: rgba(231,76,60,.4); color: var(--red); }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(200,134,10,.2); border-top-color: var(--amber); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-state { padding: 48px; text-align: center; }

  @media (max-width: 768px) {
    .main { padding: 16px; }
    .controls { flex-direction: column; align-items: stretch; }
    .filter-tabs { overflow-x: auto; }
    th:nth-child(4), td:nth-child(4),
    th:nth-child(5), td:nth-child(5) { display: none; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">✦</div>
    <div class="login-title">Food Art Director</div>
    <div class="login-sub">Painel Administrativo</div>
    <input class="login-input" type="password" id="admin-pass" placeholder="Senha de acesso" autocomplete="off">
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-err"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-logo">✦ FOOD ART DIRECTOR</span>
      <span class="topbar-badge">ADMIN</span>
    </div>
    <div class="topbar-right">
      <button class="btn-refresh" onclick="loadData()">↺ Atualizar</button>
      <span id="last-update" style="font-size:10px;color:var(--text3)"></span>
      <button class="btn-logout" onclick="doLogout()">Sair</button>
    </div>
  </div>

  <div class="main">
    <!-- METRICS -->
    <div class="metrics">
      <div class="metric-card">
        <div class="metric-label">Total cadastros</div>
        <div class="metric-value" id="m-total">—</div>
        <div class="metric-sub">todos os usuários</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Assinantes PRO</div>
        <div class="metric-value amber" id="m-pro">—</div>
        <div class="metric-sub">plano ativo</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Plano Free</div>
        <div class="metric-value" id="m-free">—</div>
        <div class="metric-sub">sem assinatura</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Taxa de conversão</div>
        <div class="metric-value green" id="m-conv">—</div>
        <div class="metric-sub">free → PRO</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Cadastros hoje</div>
        <div class="metric-value blue" id="m-hoje">—</div>
        <div class="metric-sub" id="m-hoje-sub">novos usuários</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Com WhatsApp</div>
        <div class="metric-value" id="m-whats">—</div>
        <div class="metric-sub">contato disponível</div>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" type="text" id="search-input" placeholder="Buscar por nome, email ou WhatsApp..." oninput="filterTable()">
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="setFilter('todos', this)">Todos</button>
        <button class="filter-tab" onclick="setFilter('pro', this)">✦ PRO</button>
        <button class="filter-tab" onclick="setFilter('free', this)">Free</button>
        <button class="filter-tab" onclick="setFilter('sem-whats', this)">Sem WhatsApp</button>
        <button class="filter-tab" onclick="setFilter('hoje', this)">Hoje</button>
      </div>
      <button class="btn-csv" onclick="exportCSV()">⬇ Exportar CSV</button>
    </div>

    <!-- TABLE -->
    <div class="table-wrap">
      <div class="table-header">
        <span class="table-title">Usuários cadastrados</span>
        <span class="table-count" id="table-count"></span>
      </div>
      <div id="table-body">
        <div class="loading-state"><span class="spinner"></span></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────
const ADMIN_PASSWORD = '15091989';
const SUPABASE_URL = 'https://yclvvfapkdwltayuiivy.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljbHZ2ZmFwa2R3bHRheXVpaXZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NzExMDMsImV4cCI6MjA5NDU0NzEwM30.O4fuDlL_KGPPO9WHaazrOtbkfO5KVpbVwpND5sVH0IA';

// ── STATE ─────────────────────────────────────────────────────────
var sb;
var allUsers = [];
var currentFilter = 'todos';

function initSupabase() {
  if (typeof supabase !== 'undefined' && !sb) {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
  return !!sb;
}

// ── LOGIN ─────────────────────────────────────────────────────────
document.getElementById('admin-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

function doLogin() {
  initSupabase();
  const pass = document.getElementById('admin-pass').value;
  if (pass === ADMIN_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    sessionStorage.setItem('fa_admin', '1');
    loadData();
  } else {
    document.getElementById('login-err').textContent = 'Senha incorreta.';
    document.getElementById('admin-pass').value = '';
  }
}

function doLogout() {
  sessionStorage.removeItem('fa_admin');
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('admin-pass').value = '';
}

// Auto-login se já autenticado
window.addEventListener('load', function() {
  initSupabase();
  if (sessionStorage.getItem('fa_admin') === '1') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    loadData();
  }
});

// ── LOAD DATA ─────────────────────────────────────────────────────
async function loadData() {
  if (!initSupabase()) {
    document.getElementById('table-body').innerHTML = '<div class="empty-state">Erro: recarregue a pagina.</div>';
    return;
  }
  document.getElementById('table-body').innerHTML = '<div class="loading-state"><span class="spinner"></span></div>';

  try {
    // Busca profiles (cadastros)
    const { data: profiles, error: e1 } = await sb
      .from('profiles')
      .select('*')
      .order('created_at', { ascending: false });

    if (e1) throw e1;

    // Busca assinaturas (PRO)
    const { data: assinaturas, error: e2 } = await sb
      .from('assinaturas')
      .select('email, ativo, plano, data_compra, updated_at');

    if (e2) throw e2;

    // Merge
    const assMap = {};
    (assinaturas || []).forEach(a => { assMap[a.email] = a; });

    allUsers = (profiles || []).map(p => ({
      ...p,
      assinatura: assMap[p.email] || null,
      isPro: !!(assMap[p.email] && assMap[p.email].ativo)
    }));

    // Também inclui assinantes que podem não ter profile ainda
    (assinaturas || []).forEach(a => {
      if (!profiles || !profiles.find(p => p.email === a.email)) {
        allUsers.push({
          id: null, email: a.email, name: null, whatsapp: null,
          plan: 'pro', created_at: a.data_compra,
          assinatura: a, isPro: a.ativo
        });
      }
    });

    updateMetrics();
    renderTable();

    const now = new Date();
    document.getElementById('last-update').textContent =
      'Atualizado às ' + now.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});

  } catch (err) {
    console.error(err);
    document.getElementById('table-body').innerHTML =
      '<div class="empty-state">Erro ao carregar dados: ' + err.message + '</div>';
    showToast('Erro ao carregar dados', 'error');
  }
}

// ── METRICS ──────────────────────────────────────────────────────
function updateMetrics() {
  const total = allUsers.length;
  const pro = allUsers.filter(u => u.isPro).length;
  const free = total - pro;
  const conv = total > 0 ? Math.round((pro / total) * 100) : 0;
  const comWhats = allUsers.filter(u => u.whatsapp).length;

  const hoje = new Date().toISOString().split('T')[0];
  const cadastrosHoje = allUsers.filter(u => u.created_at && u.created_at.startsWith(hoje)).length;

  document.getElementById('m-total').textContent = total;
  document.getElementById('m-pro').textContent = pro;
  document.getElementById('m-free').textContent = free;
  document.getElementById('m-conv').textContent = conv + '%';
  document.getElementById('m-hoje').textContent = cadastrosHoje;
  document.getElementById('m-whats').textContent = comWhats;
}

// ── FILTER ───────────────────────────────────────────────────────
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterTable();
}

function filterTable() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  const hoje = new Date().toISOString().split('T')[0];

  let filtered = allUsers.filter(u => {
    if (currentFilter === 'pro') return u.isPro;
    if (currentFilter === 'free') return !u.isPro;
    if (currentFilter === 'sem-whats') return !u.whatsapp;
    if (currentFilter === 'hoje') return u.created_at && u.created_at.startsWith(hoje);
    return true;
  });

  if (q) {
    filtered = filtered.filter(u =>
      (u.name || '').toLowerCase().includes(q) ||
      (u.email || '').toLowerCase().includes(q) ||
      (u.whatsapp || '').includes(q)
    );
  }

  renderTable(filtered);
}

// ── RENDER TABLE ─────────────────────────────────────────────────
function renderTable(users) {
  const data = users !== undefined ? users : allUsers;
  document.getElementById('table-count').textContent = data.length + ' usuário(s)';

  if (!data.length) {
    document.getElementById('table-body').innerHTML = '<div class="empty-state">Nenhum usuário encontrado</div>';
    return;
  }

  const rows = data.map(u => {
    const nome = u.name || '<span style="color:var(--text3)">—</span>';
    const email = u.email || '—';
    const whats = u.whatsapp ? formatWhats(u.whatsapp) : '<span style="color:var(--text3)">—</span>';
    const whatsLink = u.whatsapp
      ? `<a class="whats-link" href="https://wa.me/55${u.whatsapp}" target="_blank">${formatWhats(u.whatsapp)}</a>`
      : '<span style="color:var(--text3)">—</span>';

    const plano = u.isPro
      ? '<span class="badge badge-pro">✦ PRO</span>'
      : '<span class="badge badge-free">Free</span>';

    const hoje = new Date().toISOString().split('T')[0];
    const isNovo = u.created_at && u.created_at.startsWith(hoje);
    const novoBadge = isNovo ? ' <span class="badge badge-new">Novo</span>' : '';

    const data_cad = u.created_at ? formatDate(u.created_at) : '—';
    const data_pag = u.assinatura && u.assinatura.data_compra ? formatDate(u.assinatura.data_compra) : '—';

    const btnAcao = u.isPro
      ? `<button class="action-btn btn-desativar" onclick="togglePro('${u.email}', false, this)">Desativar PRO</button>`
      : `<button class="action-btn btn-ativar" onclick="togglePro('${u.email}', true, this)">Ativar PRO</button>`;

    return `<tr>
      <td><div class="td-name">${nome}${novoBadge}</div></td>
      <td><div class="td-email" title="${email}">${email}</div></td>
      <td class="td-whats">${whatsLink}</td>
      <td>${plano}</td>
      <td class="td-date">${data_cad}</td>
      <td class="td-date">${data_pag}</td>
      <td>${btnAcao}</td>
    </tr>`;
  }).join('');

  document.getElementById('table-body').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Email</th>
          <th>WhatsApp</th>
          <th>Plano</th>
          <th>Cadastro</th>
          <th>Pagamento</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── TOGGLE PRO ────────────────────────────────────────────────────
async function togglePro(email, ativar, btn) {
  if (!initSupabase()) { showToast('Erro de conexao', 'error'); return; }
  btn.classList.add('btn-loading');
  btn.textContent = '...';

  try {
    if (ativar) {
      // Upsert na tabela assinaturas
      const { error } = await sb.from('assinaturas').upsert({
        email,
        ativo: true,
        plano: 'pro',
        data_compra: new Date().toISOString(),
        updated_at: new Date().toISOString()
      }, { onConflict: 'email' });
      if (error) throw error;
      showToast('✦ PRO ativado para ' + email, 'success');
    } else {
      const { error } = await sb.from('assinaturas')
        .update({ ativo: false, updated_at: new Date().toISOString() })
        .eq('email', email);
      if (error) throw error;
      showToast('PRO desativado para ' + email, 'success');
    }

    // Atualizar state local
    const u = allUsers.find(x => x.email === email);
    if (u) {
      u.isPro = ativar;
      if (!u.assinatura) u.assinatura = {};
      u.assinatura.ativo = ativar;
      if (ativar) u.assinatura.data_compra = new Date().toISOString();
    }

    updateMetrics();
    filterTable();

  } catch (err) {
    showToast('Erro: ' + err.message, 'error');
    btn.classList.remove('btn-loading');
    btn.textContent = ativar ? 'Ativar PRO' : 'Desativar PRO';
  }
}

// ── EXPORT CSV ────────────────────────────────────────────────────
function exportCSV() {
  const headers = ['Nome', 'Email', 'WhatsApp', 'Plano', 'Data Cadastro', 'Data Pagamento'];
  const rows = allUsers.map(u => [
    u.name || '',
    u.email || '',
    u.whatsapp ? formatWhats(u.whatsapp) : '',
    u.isPro ? 'PRO' : 'Free',
    u.created_at ? formatDate(u.created_at) : '',
    u.assinatura && u.assinatura.data_compra ? formatDate(u.assinatura.data_compra) : ''
  ]);

  const csv = [headers, ...rows].map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'foodart-usuarios-' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV exportado!', 'success');
}

// ── HELPERS ───────────────────────────────────────────────────────
function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
}

function formatWhats(digits) {
  if (!digits) return '';
  const d = digits.replace(/\D/g, '');
  if (d.length === 11) return '(' + d.substring(0,2) + ') ' + d.substring(2,7) + '-' + d.substring(7);
  return digits;
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(window._tt);
  window._tt = setTimeout(() => t.classList.remove('show'), 3000);
}

// Auto refresh a cada 60s quando na tela
setInterval(() => {
  if (sessionStorage.getItem('fa_admin') === '1') loadData();
}, 60000);
</script>
